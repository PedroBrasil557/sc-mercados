[project]
name = "quantofica"
version = "0.1.0"
description = "Backend do SC Mercados: regras de negócio, coleta de preços, API e agentes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "tzdata>=2024.1",  # fusos horários na imagem slim do container
  "pypdf>=6.0",  # texto dos encartes em PDF (coleta)
  "pytesseract>=0.3.13",  # OCR dos encartes em imagem (Komprão); o binário tesseract-ocr é instalado à parte
  "Pillow>=11.0",  # imagens das páginas do encarte (OCR)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantofica.api.web" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
