name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quantofica
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quantofica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantofica" --health-interval 2s --health-retries 30
    env:
      # Os testes de integração recriam o banco quantofica_teste a partir de db/migrations.
      TEST_ADMIN_DATABASE_URL: postgresql://quantofica:ci@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quantofica
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quantofica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantofica" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: quantofica
      PGPASSWORD: ci
      PGDATABASE: quantofica
    steps:
      - uses: actions/checkout@v4
      - run: for f in db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - run: psql -v ON_ERROR_STOP=1 -f db/testar.sql

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tipos --workspace apps/mobile
      - run: npm run lint --workspace apps/mobile
