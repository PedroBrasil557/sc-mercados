name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quantofica
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quantofica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantofica" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: quantofica
      PGPASSWORD: ci
      PGDATABASE: quantofica
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/0001_inicial.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/testar.sql
