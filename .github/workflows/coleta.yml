name: Coleta de preços

# Desligada até existir o banco de produção: ligue criando a variável de repositório
# COLETA_ATIVA=true e o segredo DATABASE_URL (Supabase, região São Paulo).
on:
  schedule:
    - cron: "0 8 * * *"  # todo dia às 5h de Brasília
    - cron: "0 18 * * 4"  # quinta às 15h, quando os encartes da semana entram nos sites
  workflow_dispatch:
    inputs:
      rede:
        description: "Coletar só uma rede (giassi, cooper, angeloni, sams). Vazio = todas."
        required: false

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    if: vars.COLETA_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDE: ${{ inputs.rede }}
        run: python -m quantofica.coleta.agendador ${REDE:+--rede "$REDE"}
