name: Encartes

# Lê os encartes novos do Fort Atacadista e do Komprão (Blumenau; o do Komprão por OCR) e depois roda o Revisor sobre a fila de revisão. Encarte já
# lido é pulado, então rodar todo dia custa poucas requisições; quando sai encarte novo, procura os itens no catálogo e nos sites.
on:
  schedule:
    - cron: "0 10 * * *"  # todo dia às 7h de Brasília
  workflow_dispatch:

concurrency:
  group: encartes
  cancel-in-progress: false

jobs:
  fort:
    if: vars.COLETA_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install .
      - name: Fort Atacadista
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m quantofica.coleta.fort
      - name: Tesseract (OCR do encarte do Komprão, que é só imagem)
        if: always()
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por
      - name: Komprão
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m quantofica.coleta.komprao
      - name: Fort (preços do site)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m quantofica.coleta.fort_site
      - name: Revisor (decide a fila de revisão)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m quantofica.agentes.revisor
